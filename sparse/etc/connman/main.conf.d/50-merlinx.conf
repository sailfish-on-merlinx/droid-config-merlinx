[General]
# This replaces the list in /etc/connman/main.conf, so keep its entries
# (ifb,p2p,usb,rmnet,rev_rmnet; usb = the USB networking gadget owned by
# usb-moded) and add the MTK internal/auxiliary interfaces ccmni-lan and wlan1.
NetworkInterfaceBlacklist = ifb,p2p,usb,rmnet,rev_rmnet,ccmni-lan,wlan1
