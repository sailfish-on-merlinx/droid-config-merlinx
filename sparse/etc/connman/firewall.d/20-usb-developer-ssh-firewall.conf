# Developer mode SSH over USB. usb0 is on the connman interface blacklist
# (usb-moded owns it), so the [ethernet] devmode rule never applies to it.
# usb0 only has an address in developer mode, when sshd runs.
[General]
IPv4.INPUT.RULES = -i usb0 -p tcp -m tcp --dport 22 -j ACCEPT
IPv6.INPUT.RULES = -i usb0 -p tcp -m tcp --dport 22 -j ACCEPT
