[configfs]
# The usb-moded default RNDIS function is Qualcomm rndis_bam.rndis, which
# does not exist on MediaTek: use the generic rndis.usb0. usb-moded starts
# before droid-hal-init, and the vendor configs/b.1 can never be created
# here (mkdir fails with EBUSY once the gadget is bound), so use configs/c.1,
# which the hybris-boot initrd creates and binds.
gadget_conf_directory = configs/c.1
function_rndis        = rndis.usb0
function_mtp          = ffs.mtp

[network]
interface = usb0
