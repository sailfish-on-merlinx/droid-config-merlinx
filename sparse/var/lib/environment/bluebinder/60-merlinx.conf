# The MT6768 connsys controller advertises Synchronization Train in LMP
# features page 2 but answers Read Synchronization Train Parameters with
# "Unknown HCI Command", so the kernel aborts hci0 init (EBADRQC) and
# BlueZ never sees an adapter. Clear that bit (byte 0, 0x04), as LuneOS
# does for the MT6789 (Minimal Phone MP01).
BLUEBINDER_LOCAL_EXT_FEATURES_PAGE_2_MASK=0x0400000000000000
