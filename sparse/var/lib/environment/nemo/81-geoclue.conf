# geoclue-hybris 0.3.1 prefers the AIDL GNSS HAL when one is registered.
# The MediaTek service registers AIDL IGnss as well as HIDL 2.1, but over
# AIDL setPositionMode fails (the HAL never opens its mtk_mnl2hal socket);
# HIDL 2.1 works. Same as Volla algiz and nagara.
GEOCLUE_HYBRIS_DISABLE_AIDL=1
