# merlinx: the vibrator driver runs at least 25 ms (cust:25ms), and the
# defaults (5-20 ms) are too short to feel. Durations follow the Android
# vibrator HAL on this device (hardware/mediatek/aidl/vibrator, no
# ro.vendor.vibrator.hal.* overrides): CLICK 50, TICK 32, TEXTURE_TICK 25.
# Keyboard presses (touch_weak) use CLICK, as Android's keyboard does: 32 ms
# was too weak to feel when typing.
[droid-vibrator]
touch           = on=50
release         = on=32
touch_weak      = on=50
release_weak    = on=25
touch_strong    = on=50
release_strong  = on=50
drag_start      = on=25
drag_end        = on=25
drag_fail       = on=25
drag_boundary   = on=25
